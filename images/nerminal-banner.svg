<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f0620"/>
      <stop offset="45%" stop-color="#2b1150"/>
      <stop offset="76%" stop-color="#7c1a86"/>
      <stop offset="100%" stop-color="#e0257f"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe14d"/>
      <stop offset="55%" stop-color="#ff8a3d"/>
      <stop offset="100%" stop-color="#ff2d95"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="42%" stop-color="#9be9ff"/>
      <stop offset="48%" stop-color="#2a7fa8"/>
      <stop offset="52%" stop-color="#ff2d95"/>
      <stop offset="100%" stop-color="#ffb54d"/>
    </linearGradient>
    <clipPath id="sunclip"><rect x="0" y="0" width="1200" height="300"/></clipPath>
    <clipPath id="below"><rect x="0" y="300" width="1200" height="120"/></clipPath>
  </defs>

  <rect width="1200" height="420" fill="url(#sky)"/>

  <g fill="#ffffff" opacity="0.6">
    <circle cx="120" cy="52" r="2"/><circle cx="260" cy="96" r="1.4"/>
    <circle cx="980" cy="44" r="2.2"/><circle cx="1088" cy="104" r="1.5"/>
    <circle cx="700" cy="36" r="1.5"/><circle cx="430" cy="62" r="1.7"/>
    <circle cx="856" cy="128" r="1.3"/><circle cx="182" cy="150" r="1.2"/>
  </g>

  <g clip-path="url(#sunclip)">
    <circle cx="600" cy="300" r="150" fill="url(#sun)"/>
    <g fill="#2b1150">
      <rect x="440" y="238" width="320" height="7"/>
      <rect x="440" y="256" width="320" height="10"/>
      <rect x="440" y="278" width="320" height="13"/>
    </g>
  </g>

  <rect x="0" y="298" width="1200" height="4" fill="#8be9fd"/>
  <g clip-path="url(#below)" stroke="#8be9fd" stroke-width="2" fill="none" opacity="0.45">
    <line x1="600" y1="302" x2="-320" y2="420"/>
    <line x1="600" y1="302" x2="80" y2="420"/>
    <line x1="600" y1="302" x2="360" y2="420"/>
    <line x1="600" y1="302" x2="600" y2="420"/>
    <line x1="600" y1="302" x2="840" y2="420"/>
    <line x1="600" y1="302" x2="1120" y2="420"/>
    <line x1="600" y1="302" x2="1520" y2="420"/>
    <line x1="0" y1="318" x2="1200" y2="318"/>
    <line x1="0" y1="344" x2="1200" y2="344"/>
    <line x1="0" y1="382" x2="1200" y2="382"/>
  </g>

  <text x="600" y="104" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="20" font-weight="bold" letter-spacing="9" fill="#8be9fd" opacity="0.9">NERD TERMINAL</text>

  <g font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">
    <text x="600" y="232" font-size="112" letter-spacing="10"
          fill="none" stroke="#ff2d95" stroke-width="14" opacity="0.5">NERMINAL</text>
    <text x="600" y="232" font-size="112" letter-spacing="10"
          fill="url(#word)" stroke="#12061f" stroke-width="2.5">NERMINAL</text>
  </g>


</svg>
