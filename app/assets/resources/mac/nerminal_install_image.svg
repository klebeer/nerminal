<svg xmlns="http://www.w3.org/2000/svg" width="700" height="500" viewBox="0 0 700 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1226"/>
      <stop offset="55%" stop-color="#282a36"/>
      <stop offset="100%" stop-color="#3a1f4d"/>
    </linearGradient>
  </defs>

  <rect width="700" height="500" fill="url(#bg)"/>

  <!-- horizon and perspective grid, same language as the app icon -->
  <rect x="0" y="392" width="700" height="3" fill="#8be9fd" opacity="0.8"/>
  <g stroke="#8be9fd" stroke-width="1.4" opacity="0.28" fill="none">
    <line x1="350" y1="395" x2="-160" y2="500"/>
    <line x1="350" y1="395" x2="40" y2="500"/>
    <line x1="350" y1="395" x2="200" y2="500"/>
    <line x1="350" y1="395" x2="350" y2="500"/>
    <line x1="350" y1="395" x2="500" y2="500"/>
    <line x1="350" y1="395" x2="660" y2="500"/>
    <line x1="350" y1="395" x2="860" y2="500"/>
    <line x1="0" y1="410" x2="700" y2="410"/>
    <line x1="0" y1="436" x2="700" y2="436"/>
    <line x1="0" y1="472" x2="700" y2="472"/>
  </g>

  <g fill="#f8f8f2" opacity="0.5">
    <circle cx="86" cy="64" r="1.8"/><circle cx="184" cy="42" r="1.3"/>
    <circle cx="596" cy="58" r="1.6"/><circle cx="644" cy="112" r="1.2"/>
    <circle cx="452" cy="36" r="1.3"/>
  </g>

  <text x="350" y="86" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="30" font-weight="600" fill="#f8f8f2" letter-spacing="1">Nerminal</text>
  <text x="350" y="114" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="14" fill="#bd93f9">Nerd Terminal</text>

  <!-- arrow between the two icon slots that create-dmg places at x=150 and x=550, y=250 -->
  <g stroke="#ff79c6" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.85">
    <line x1="268" y1="250" x2="428" y2="250"/>
    <polyline points="408,232 430,250 408,268"/>
  </g>

  <text x="150" y="352" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="13" fill="#6272a4">Nerminal</text>
  <text x="550" y="352" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="13" fill="#6272a4">Applications</text>
  <text x="350" y="304" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="13" fill="#6272a4">Drag to install</text>
</svg>
