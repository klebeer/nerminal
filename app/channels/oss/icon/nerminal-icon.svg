<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#150733"/>
      <stop offset="38%"  stop-color="#3a1170"/>
      <stop offset="66%"  stop-color="#7c1a86"/>
      <stop offset="86%"  stop-color="#e0257f"/>
      <stop offset="100%" stop-color="#ff7a3d"/>
    </linearGradient>

    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3a2c5c"/>
      <stop offset="55%"  stop-color="#251a40"/>
      <stop offset="100%" stop-color="#181029"/>
    </linearGradient>

    <radialGradient id="screenGlow" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0%"   stop-color="#132a3d"/>
      <stop offset="70%"  stop-color="#0a0a1c"/>
      <stop offset="100%" stop-color="#06050f"/>
    </radialGradient>

    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#ff2d95" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff2d95" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="frame">
      <rect x="10" y="10" width="492" height="492" rx="112" ry="112"/>
    </clipPath>
    <clipPath id="screenClip">
      <rect x="116" y="146" width="280" height="168" rx="20" ry="20"/>
    </clipPath>
    <clipPath id="belowHorizon">
      <rect x="0" y="342" width="512" height="170"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="0" y="0" width="512" height="512" fill="url(#sky)"/>

    <!-- starfield -->
    <g fill="#ffffff" opacity="0.75">
      <circle cx="64"  cy="58"  r="2.6"/>
      <circle cx="132" cy="104" r="1.8"/>
      <circle cx="418" cy="72"  r="2.4"/>
      <circle cx="464" cy="132" r="1.6"/>
      <circle cx="352" cy="44"  r="1.7"/>
      <circle cx="228" cy="40"  r="2.0"/>
      <circle cx="88"  cy="168" r="1.5"/>
      <circle cx="446" cy="212" r="1.5"/>
    </g>

    <!-- neon horizon -->
    <rect x="0" y="338" width="512" height="5" fill="#00e5ff" opacity="0.9"/>
    <rect x="0" y="332" width="512" height="18" fill="#00e5ff" opacity="0.18"/>

    <!-- perspective grid -->
    <g clip-path="url(#belowHorizon)" stroke="#00e5ff" fill="none" opacity="0.6">
      <g stroke-width="3">
        <line x1="256" y1="342" x2="-240" y2="512"/>
        <line x1="256" y1="342" x2="-60"  y2="512"/>
        <line x1="256" y1="342" x2="76"   y2="512"/>
        <line x1="256" y1="342" x2="176"  y2="512"/>
        <line x1="256" y1="342" x2="256"  y2="512"/>
        <line x1="256" y1="342" x2="336"  y2="512"/>
        <line x1="256" y1="342" x2="436"  y2="512"/>
        <line x1="256" y1="342" x2="572"  y2="512"/>
        <line x1="256" y1="342" x2="752"  y2="512"/>
      </g>
      <g stroke-width="3.5">
        <line x1="0" y1="356" x2="512" y2="356"/>
        <line x1="0" y1="376" x2="512" y2="376"/>
        <line x1="0" y1="404" x2="512" y2="404"/>
        <line x1="0" y1="442" x2="512" y2="442"/>
        <line x1="0" y1="492" x2="512" y2="492"/>
      </g>
    </g>

    <!-- glow behind the monitor -->
    <ellipse cx="256" cy="240" rx="230" ry="180" fill="url(#halo)"/>

    <!-- stand -->
    <path d="M226 322 h60 l14 60 h-88 z" fill="#1d1533"/>
    <rect x="176" y="378" width="160" height="22" rx="11" fill="url(#bezel)" stroke="#ff2d95" stroke-width="5"/>

    <!-- monitor -->
    <rect x="80" y="112" width="352" height="230" rx="36" fill="url(#bezel)" stroke="#ff2d95" stroke-width="8"/>
    <rect x="116" y="146" width="280" height="168" rx="20" fill="url(#screenGlow)"/>

    <g clip-path="url(#screenClip)">
      <!-- scanlines -->
      <g fill="#ffffff" opacity="0.06">
        <rect x="116" y="150" width="280" height="3"/>
        <rect x="116" y="160" width="280" height="3"/>
        <rect x="116" y="170" width="280" height="3"/>
        <rect x="116" y="180" width="280" height="3"/>
        <rect x="116" y="190" width="280" height="3"/>
        <rect x="116" y="200" width="280" height="3"/>
        <rect x="116" y="210" width="280" height="3"/>
        <rect x="116" y="220" width="280" height="3"/>
        <rect x="116" y="230" width="280" height="3"/>
        <rect x="116" y="240" width="280" height="3"/>
        <rect x="116" y="250" width="280" height="3"/>
        <rect x="116" y="260" width="280" height="3"/>
        <rect x="116" y="270" width="280" height="3"/>
        <rect x="116" y="280" width="280" height="3"/>
        <rect x="116" y="290" width="280" height="3"/>
        <rect x="116" y="300" width="280" height="3"/>
        <rect x="116" y="310" width="280" height="3"/>
      </g>

      <!-- nerd glasses: the lenses are the eyes -->
      <g>
        <circle cx="190" cy="204" r="44" fill="#0c2b26"/>
        <circle cx="322" cy="204" r="44" fill="#0c2b26"/>
        <g fill="none" stroke="#07060f" stroke-width="15">
          <circle cx="190" cy="204" r="44"/>
          <circle cx="322" cy="204" r="44"/>
          <path d="M234 200 q22 -14 44 0"/>
          <path d="M146 196 l-30 -14"/>
          <path d="M366 196 l30 -14"/>
        </g>
        <!-- taped bridge -->
        <rect x="243" y="178" width="26" height="30" rx="4" fill="#f4f1e4" opacity="0.92" transform="rotate(-12 256 193)"/>
        <!-- lens shine -->
        <g stroke="#eafcff" stroke-width="9" stroke-linecap="round" opacity="0.55">
          <line x1="170" y1="192" x2="192" y2="176"/>
          <line x1="302" y1="192" x2="324" y2="176"/>
        </g>
      </g>

      <!-- prompt as the mouth -->
      <g stroke="#39ff9c" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <polyline points="212,258 240,278 212,298"/>
      </g>
      <rect x="258" y="288" width="46" height="12" rx="6" fill="#39ff9c"/>
    </g>

    <!-- power LED -->
    <circle cx="396" cy="328" r="7" fill="#39ff9c"/>
    <circle cx="396" cy="328" r="13" fill="#39ff9c" opacity="0.28"/>
  </g>
</svg>
